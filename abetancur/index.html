<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #003064;
    --naranja: #FF8300;
    --gris-oscuro: #4D4D4D;
    --gris: #C4C4C4;
    --fondo: #F4F6F9;
    --blanco: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--fondo);
    color: var(--navy);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 420px; }
  .cabecera {
    background: linear-gradient(160deg, var(--navy) 0%, #001A36 55%, #000000 100%);
    color: var(--blanco);
    text-align: center;
    border-radius: 20px 20px 0 0;
    padding: 32px 28px 26px;
    border-bottom: 5px solid var(--naranja);
  }
  .logo { display: block; width: 52%; max-width: 190px; height: auto; margin: 0 auto 24px; }
  h1 { font-size: 26px; font-weight: 700; line-height: 1.2; }
  .cargo { margin-top: 6px; font-size: 15px; opacity: .85; }
  .cuerpo {
    background: var(--blanco);
    border: 1px solid #E1E5EB;
    border-top: 0;
    border-radius: 0 0 20px 20px;
    padding: 24px 28px 28px;
  }
  .guardar {
    display: block;
    text-align: center;
    background: var(--naranja);
    color: var(--navy);
    text-decoration: none;
    font-weight: 700;
    font-size: 17px;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 18px;
  }
  .guardar:active { transform: scale(.98); }
  ul { list-style: none; }
  li a {
    display: flex; flex-direction: column;
    padding: 13px 0;
    border-bottom: 1px solid #E6E6E6;
    text-decoration: none; color: var(--navy);
  }
  li:last-child a { border-bottom: 0; }
  li span { font-size: 13px; color: var(--gris-oscuro); }
  li strong { font-size: 16px; font-weight: 600; word-break: break-word; }
  a:focus-visible { outline: 3px solid var(--naranja); outline-offset: 3px; border-radius: 6px; }
</style>
</head>
